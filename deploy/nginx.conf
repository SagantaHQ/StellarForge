# ============================================================
# StellarForge — Nginx Reverse Proxy Configuration
# Domain: stellarforge.app (and www.stellarforge.app)
#
# This template proxies:
#   - HTTPS → Next.js app (port 3000)
#   - /collab → WebSocket collab server (port 3002)
#   - /lsp → WebSocket LSP server (port 3099)
#   - WebSocket upgrade support for all paths
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/stellarforge.app
#   2. Symlink: ln -s /etc/nginx/sites-available/stellarforge.app /etc/nginx/sites-enabled/
#   3. Get SSL certs: certbot --nginx -d stellarforge.app -d www.stellarforge.app
#   4. Test: nginx -t
#   5. Reload: systemctl reload nginx
#
# Prerequisites:
#   - Next.js running on port 3000 (bun run start or bm2)
#   - Collab server running on port 3002 (mini-services/collab-server)
#   - LSP server running on port 3099 (mini-services/lsp-server)
#   - SSL certificates via Let's Encrypt (certbot)
# ============================================================

# Rate limiting zone — protects against abuse
limit_req_zone $binary_remote_addr zone=stellarforge_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stellarforge_ws:10m rate=5r/s;

# Upload size for file imports / avatar uploads
client_max_body_size 25M;

# ─── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name stellarforge.app www.stellarforge.app;

    # Let's Encrypt challenge path (certbot places files here during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server ───────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stellarforge.app www.stellarforge.app;

    # ─── SSL (managed by certbot — do not edit manually) ────
    ssl_certificate /etc/letsencrypt/live/stellarforge.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellarforge.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/stellarforge.app/chain.pem;

    # ─── SSL hardening ───────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── Security headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP — allows inline styles (Next.js), script-src with nonce, connect-src for Stellar RPC + WebSockets
    # NOTE: If using nonces, replace 'unsafe-inline' with 'nonce-{random}'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self';" always;

    # ─── www → non-www redirect ──────────────────────────────
    if ($host = www.stellarforge.app) {
        return 301 https://stellarforge.app$request_uri;
    }

    # ─── WebSocket: Collab server (/collab/) ─────────────────
    # Proxies to the Yjs WebSocket collab server on port 3002.
    # The /collab path matches next.config.ts rewrites.
    location /collab/ {
        # WebSocket upgrade headers
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific timeouts (keep alive for long sessions)
        proxy_read_timeout 86400s;  # 24 hours
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;

        # Rate limit (5 conn/s per IP — generous for collab)
        limit_req zone=stellarforge_ws burst=10 nodelay;
    }

    # ─── WebSocket: LSP server (/lsp and /workspace/) ────────
    # Proxies to the rust-analyzer LSP server on port 3099.
    location /lsp {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;

        limit_req zone=stellarforge_ws burst=10 nodelay;
    }

    location /workspace/ {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── Static assets (Next.js /_next/static/) ──────────────
    # Cache aggressively — these files are content-hashed
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1 year cache (immutable because of content hashing)
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Public static files (/public/) ───────────────────────
    location ~ ^/(favicon|icon|manifest|sw\.js|robots\.txt|saganta-logo) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ─── API routes (/api/) ──────────────────────────────────
    # Higher rate limit for API calls, no caching
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Rate limit (10 req/s per IP, burst 20)
        limit_req zone=stellarforge_api burst=20 nodelay;

        # Allow larger payloads for file uploads / project imports
        client_max_body_size 25M;
    }

    # ─── Next.js app (everything else) ────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js dev server uses WS for HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # General timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Rate limit (10 req/s per IP, burst 20)
        limit_req zone=stellarforge_api burst=20 nodelay;
    }

    # ─── Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # ─── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/stellarforge.app.access.log;
    error_log /var/log/nginx/stellarforge.app.error.log warn;

    # ─── Custom error pages ──────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}

# ─── WebSocket connection upgrade map ────────────────────────
# This must be at the http {} level (included via /etc/nginx/conf.d/
# or in the main nginx.conf http block)
#
# Create this file: /etc/nginx/conf.d/upgrade.conf
# --- content ---
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
# --- end content ---
