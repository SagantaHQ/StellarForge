# ============================================================
# StellarForge — Nginx Reverse Proxy Configuration
# Domain: stellarforge.app (and www.stellarforge.app)
#
# Proxies:
#   - HTTP → Next.js app (port 3700, next start)
#   - /collab → WebSocket collab server (port 3002)
#   - /lsp → WebSocket LSP server (port 3099)
#   - WebSocket upgrade support for all paths
#
# SSL is managed by certbot — it will auto-inject the
# ssl_certificate directives when you run:
#   certbot --nginx -d stellarforge.app -d www.stellarforge.app
# Do NOT add SSL directives manually.
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/stellarforge.app
#   2. Symlink: ln -s /etc/nginx/sites-available/stellarforge.app /etc/nginx/sites-enabled/
#   3. certbot --nginx -d stellarforge.app -d www.stellarforge.app
#   4. nginx -t && systemctl reload nginx
#
# Prerequisites:
#   - Next.js running on port 3700 (bun run start)
#   - Collab server running on port 3002 (bm2 or manually)
#   - LSP server running on port 3099 (bm2 or manually)
# ============================================================

# ─── WebSocket upgrade map (MUST be outside server block) ───
# This tells nginx how to handle the Connection header for WebSocket
# upgrades. Without this, WebSocket connections fail with
# "unknown connection_upgrade variable".
# This is defined INLINE here — no need for a separate upgrade.conf file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=stellarforge_api:10m rate=10r/s;

# Upload size for file imports / avatar uploads
client_max_body_size 25M;

# ─── HTTP server (certbot will add the 443 block automatically) ──
server {
    listen 80;
    listen [::]:80;
    server_name stellarforge.app www.stellarforge.app;

    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ─── www → non-www redirect ──────────────────────────────
    if ($host = www.stellarforge.app) {
        return 301 https://stellarforge.app$request_uri;
    }

    # certbot will insert the HTTPS redirect here after running:
    #   certbot --nginx -d stellarforge.app -d www.stellarforge.app

    # ─── WebSocket: Collab server (/collab/) ─────────────────
    # Proxies to the Yjs WebSocket collab server on port 3002.
    # This is the cross-device live collaboration server.
    # Client connects via: wss://stellarforge.app/collab/stellarforge-<roomId>
    location /collab/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── WebSocket: LSP server (/lsp and /workspace/) ────────
    # Proxies to the rust-analyzer LSP server on port 3099.
    # /lsp is the WebSocket endpoint for LSP/JSON-RPC protocol.
    # /workspace/ serves files from the build workspace (for go-to-def etc.)
    location /lsp {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /workspace/ {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── API routes (/api/) ──────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        limit_req zone=stellarforge_api burst=20 nodelay;
        client_max_body_size 25M;
    }

    # ─── Next.js app (everything else) ────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        limit_req zone=stellarforge_api burst=20 nodelay;
    }

    # ─── Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # ─── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/stellarforge.app.access.log;
    error_log /var/log/nginx/stellarforge.app.error.log warn;

    # ─── Custom error pages ──────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}
