# ============================================================
# Soroban.Build — Docker Compose (§7)
#
# Services:
#   app      — Next.js IDE (port 3000)
#   postgres — PostgreSQL database (port 5432)
#   collab   — WebSocket collaboration server (port 3001)
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f app
#   docker-compose down
# ============================================================

services:
  # --- Next.js IDE ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://soroban:soroban@postgres:5432/soroban_build
      - DIRECT_DATABASE_URL=postgresql://soroban:soroban@postgres:5432/soroban_build
      - WS_PORT=3001
      - WS_CORS_ORIGIN=*
      - GIT_REMOTE_URL=https://github.com/SagantaHQ/soroban.build
      - GIT_AUTHOR_NAME=ra-sun-god
      - GIT_AUTHOR_EMAIL=ra-sun-god@users.noreply.github.com
      - STELLAR_RPC_TESTNET=https://rpc.testnet.stellar.org
      - STELLAR_RPC_MAINNET=https://rpc.mainnet.stellar.org
      - RUST_TOOLCHAIN=stable
      - SOROBAN_SDK_VERSION=22.0.0
      - TERMINAL_EGRESS_ALLOWLIST=crates.io,static.crates.io,rpc.stellar.org,horizon.stellar.org,github.com
      - TERMINAL_CPU_LIMIT=1.0
      - TERMINAL_MEMORY_LIMIT_MB=1024
      - TERMINAL_DISK_QUOTA_MB=512
      - TERMINAL_COMMAND_TIMEOUT_MS=60000
      - AI_PROXY_ENABLED=true
      - LOG_LEVEL=info
      - KNOWLEDGE_DIR=./knowledge
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      collab:
        condition: service_healthy
    volumes:
      # Cache Rust/Cargo build artifacts across rebuilds
      - cargo-cache:/root/.cargo/registry
      - rustup-cache:/root/.rustup
      # Persist knowledge base
      - knowledge-data:/app/knowledge
      # Workspace for user projects (terminal builds)
      - workspace:/tmp/soroban-builds
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soroban
      POSTGRES_PASSWORD: soroban
      POSTGRES_DB: soroban_build
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soroban -d soroban_build"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- WebSocket Collaboration Server ---
  # (§5 — Yjs WebSocket provider for cross-device realtime editing)
  # Uses the mini-services/collab-server/ implementation (standard y-websocket protocol)
  collab:
    build:
      context: ./mini-services/collab-server
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3002 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  cargo-cache:
  rustup-cache:
  knowledge-data:
  postgres-data:
  workspace:
