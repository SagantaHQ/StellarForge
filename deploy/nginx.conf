# ============================================================
# StellarForge — Nginx Reverse Proxy Configuration
# Domain: stellarforge.app (and www.stellarforge.app)
#
# Proxies:
#   - HTTP → Next.js app (port 3700, next start)
#   - /collab → WebSocket collab server (port 3002)
#   - /lsp → WebSocket LSP server (port 3099)
#   - WebSocket upgrade support for all paths
#
# SSL is managed by certbot — it will auto-inject the
# ssl_certificate directives when you run:
#   certbot --nginx -d stellarforge.app -d www.stellarforge.app
# Do NOT add SSL directives manually.
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/stellarforge.app
#   2. Symlink: ln -s /etc/nginx/sites-available/stellarforge.app /etc/nginx/sites-enabled/
#   3. Create the WebSocket upgrade map (see bottom of file)
#   4. certbot --nginx -d stellarforge.app -d www.stellarforge.app
#   5. nginx -t && systemctl reload nginx
#
# Prerequisites:
#   - Next.js running on port 3700 (PORT=3700 next start)
#   - Collab server running on port 3002 (mini-services/collab-server)
#   - LSP server running on port 3099 (mini-services/lsp-server)
# ============================================================

# Rate limiting zone — protects against abuse
limit_req_zone $binary_remote_addr zone=stellarforge_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stellarforge_ws:10m rate=5r/s;

# Upload size for file imports / avatar uploads
client_max_body_size 25M;

# ─── HTTP server (certbot will add the 443 block automatically) ──
server {
    listen 80;
    listen [::]:80;
    server_name stellarforge.app www.stellarforge.app;


    # certbot will insert the HTTPS redirect here after running:
    #   certbot --nginx -d stellarforge.app -d www.stellarforge.app

    # ─── WebSocket: Collab server (/collab/) ─────────────────
    location /collab/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;

        limit_req zone=stellarforge_ws burst=10 nodelay;
    }

    # ─── WebSocket: LSP server (/lsp and /workspace/) ────────
    location /lsp {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;

        limit_req zone=stellarforge_ws burst=10 nodelay;
    }

    location /workspace/ {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── API routes (/api/) ──────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        limit_req zone=stellarforge_api burst=20 nodelay;
        client_max_body_size 25M;
    }

    # ─── Next.js app (everything else) ────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js dev server uses WS for HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        limit_req zone=stellarforge_api burst=20 nodelay;
    }

    # ─── Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # ─── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/stellarforge.app.access.log;
    error_log /var/log/nginx/stellarforge.app.error.log warn;

    # ─── Custom error pages ──────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}

# ─── WebSocket connection upgrade map ────────────────────────
# Must be at the http {} level. Create this file:
#   /etc/nginx/conf.d/upgrade.conf
#
# --- content ---
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
# --- end content ---
